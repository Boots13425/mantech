<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MANTech - Suggestion Box</title>
  <link rel="stylesheet" href="css/suggestions.css" />
</head>
<body>
  <div class="suggestions-page">
    <div class="suggestion-card">
      <div class="card-header">
        <div class="badge">MANTech Suggestion Box</div>
        <h1>Share your suggestion</h1>
        <p>
          This suggestion box is anonymous. Tell us what can be improved so the company can keep growing.
        </p>
      </div>

      <div id="statusMessage" class="status-message" style="display: none;"></div>

      <form id="suggestionForm" class="suggestion-form">
        <label for="suggestionText">Your suggestion</label>
        <textarea
          id="suggestionText"
          name="suggestion"
          rows="8"
          maxlength="2000"
          placeholder="Type your suggestion here..."
          required
        ></textarea>

        <div class="helper-row">
          <span>Clear, practical suggestions help us improve faster.</span>
          <span id="charCount">0 / 2000</span>
        </div>

        <div class="button-row">
          <a class="btn btn-secondary" href="attendance-sign-in.html">← Back to Attendance</a>
          <button id="submitBtn" class="btn btn-primary" type="submit">Submit Suggestion</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/suggestions.js"></script>
</body>
</html>
